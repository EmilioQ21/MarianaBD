<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
  font-family: Arial;
  background: #ffc5d3;
  color: rgb(79, 28, 13);

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(2rem, 6vw, 3.5rem);
}

#countdown {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(1.8rem, 5vw, 3rem);
  margin-top: 20px;
}

.info-btn {
  position: fixed;
  bottom: 15px;
  right: 15px;

  width: 55px;
  height: 55px;

  border-radius: 50%;
  border: none;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;
  cursor: pointer;

  background: #ffc5d3;
}

.info-btn i {
  color: rgb(79, 28, 13);
}

.music-btn {
  position: fixed;
  bottom: 15px;
  left: 15px;

  width: 55px;
  height: 55px;

  border-radius: 50%;
  border: none;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
  cursor: pointer;

  background: #ffc5d3;
}

.music-btn i {
  color: rgb(79, 28, 13);
}

.modal-content {
  border-radius: 15px;
  padding: 10px;
}

@media (max-width: 400px) {
  h1 {
    font-size: 1.8rem;
  }

  #countdown {
    font-size: 1.5rem;
  }
}

.music-btn i {
  color: rgb(79, 28, 13);
}
  </style>
</head>
<body>

  <div class="main-content">
  <h1>??? 🖤</h1>
  <div id="countdown"></div>
</div>
  <button class="music-btn" onclick="toggleMusic()">
  <i id="music-icon" class="fa-solid fa-music"></i>
    </button>

    <audio id="bg-music" autoplay  loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>
  <div id="countdown"></div>

  <button class="info-btn" data-bs-toggle="modal" data-bs-target="#infoModal">
  <i class="fa-solid fa-circle-info"></i>
</button>

<div class="modal fade" id="infoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-dark">

      <div class="modal-header">
        <h5 class="modal-title">Important information 🤓</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Hello pretty girl, te preguntaras que es esta pagina. Bueno no te dire, tendras que esperar a la fecha en la que se acaba el countdown, pero viendo cuando acaba creo que te puedes hacer una idea de lo que es jijijiji. -Emilio 🖤
      </div>

    </div>
  </div>
</div>

  <script>
    const targetDate = new Date("2026-05-12T08:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "Ya es hoy ❤️";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    

    setInterval(updateCountdown, 1000);

    const music = document.getElementById("bg-music");

    function toggleMusic() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
    }
  </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
