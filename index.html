<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mariana linda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="scene">
  <p class="date-label" id="dateLabel"></p>
  <h1 class="title">Daily letter 😊</h1>

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-body">
        <div class="env-flap"></div>
        <div class="letter-peek"></div>
        <div class="wax-seal">🖤</div>
      </div>
    </div>
    <p class="hint" id="hint">Toca para abrir tu carta de hoy</p>
  </div>

  <p class="locked-msg" id="lockedMsg" style="display:none"></p>
</div>

<div class="letter-overlay" id="letterOverlay">
  <div class="letter-card">
    <button class="close-btn" id="closeBtn">cerrar ✕</button>
    <p class="letter-day" id="letterDay"></p>
    <p class="letter-salutation">Hello pretty girllll</p>
    <p class="letter-body" id="letterBody"></p>
    <img class="letter-image" id="letterImage" src="" alt="" style="display:none">
    <iframe id="letterSpotify"
    style="display:none; margin-top:1.4rem; border-radius:12px;"
    src=""
    width="100%"
    height="80"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>

  <iframe id="letterVideo"
    style="display:none; margin-top:1.4rem; border-radius:12px;"
    src=""
    width="100%"
    height="315"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>

  <iframe id="letterWordle"
  src=""
  width="100%"
  height="500"
  frameborder="0"
  style="display:none; margin-top:1.4rem; border-radius:12px;">
</iframe>

<iframe id="letterMap"
  src=""
  width="100%"
  height="300"
  frameborder="0"
  style="display:none; margin-top:1.4rem; border-radius:12px;">
</iframe>

<iframe id="letterLink"
  src=""
  width="100%"
  height="500"
  frameborder="0"
  style="display:none; margin-top:1.4rem; border-radius:12px;">
</iframe>

<iframe id="letterPlaylist"
  src=""
  width="100%"
  height="500"
  frameborder="0"
  style="display:none; margin-top:1.4rem; border-radius:12px;">
</iframe>

<iframe
  id="driveVideo"
  width="100%"
  height="315"
  allow="autoplay">
</iframe>


<div class="buttonWrap">
  <button id="externalBtn">
    Abrir sorpresiña jiji
  </button>
</div>

 <div id="cakeContainer" style="display:none; text-align:center; margin-top:2rem; margin-bottom:1rem;">
      <svg id="birthdayCake"
        width="220" height="260" viewBox="0 0 220 260"
        style="cursor:pointer; display:block; margin:0 auto;"
        onclick="blowCandles()"
        role="img"
        aria-label="Pastel de cumpleaños con velas, toca para soplarlas">
 
        <!-- piso de abajo -->
        <rect x="15" y="165" width="190" height="75" rx="10" fill="#f9a8d4"/>
        <!-- franja decorativa piso de abajo -->
        <rect x="15" y="165" width="190" height="14" rx="0" fill="#f472b6"/>
        <rect x="15" y="165" width="190" height="14" rx="10" fill="#f472b6"/>
        <!-- bolitas decorativas -->
        <circle cx="40"  cy="186" r="5" fill="#fff" opacity="0.6"/>
        <circle cx="70"  cy="198" r="5" fill="#fff" opacity="0.6"/>
        <circle cx="100" cy="186" r="5" fill="#fff" opacity="0.6"/>
        <circle cx="130" cy="198" r="5" fill="#fff" opacity="0.6"/>
        <circle cx="160" cy="186" r="5" fill="#fff" opacity="0.6"/>
        <circle cx="190" cy="198" r="5" fill="#fff" opacity="0.6"/>
 
        <!-- piso de arriba -->
        <rect x="35" y="128" width="150" height="47" rx="8" fill="#fbcfe8"/>
        <!-- franja decorativa piso de arriba -->
        <rect x="35" y="128" width="150" height="12" rx="0" fill="#f9a8d4"/>
        <rect x="35" y="128" width="150" height="12" rx="8" fill="#f9a8d4"/>
        <!-- bolitas decorativas piso de arriba -->
        <circle cx="60"  cy="148" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="85"  cy="155" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="110" cy="148" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="135" cy="155" r="4" fill="#fff" opacity="0.6"/>
        <circle cx="160" cy="148" r="4" fill="#fff" opacity="0.6"/>
 
        <!-- vela 1 -->
        <g id="candle1">
          <rect x="55"  y="98" width="11" height="30" rx="3" fill="#a78bfa"/>
          <ellipse id="flame1" cx="60.5" cy="94" rx="5.5" ry="8" fill="#fbbf24"/>
          <ellipse id="flameInner1" cx="60.5" cy="95" rx="2.5" ry="4.5" fill="#fef08a"/>
        </g>
 
        <!-- vela 2 -->
        <g id="candle2">
          <rect x="83"  y="91" width="11" height="37" rx="3" fill="#34d399"/>
          <ellipse id="flame2" cx="88.5" cy="87" rx="5.5" ry="8" fill="#fbbf24"/>
          <ellipse id="flameInner2" cx="88.5" cy="88" rx="2.5" ry="4.5" fill="#fef08a"/>
        </g>
 
        <!-- vela 3 (centro, mas alta) -->
        <g id="candle3">
          <rect x="110" y="86" width="11" height="42" rx="3" fill="#f87171"/>
          <ellipse id="flame3" cx="115.5" cy="82" rx="5.5" ry="8" fill="#fbbf24"/>
          <ellipse id="flameInner3" cx="115.5" cy="83" rx="2.5" ry="4.5" fill="#fef08a"/>
        </g>
 
        <!-- vela 4 -->
        <g id="candle4">
          <rect x="138" y="91" width="11" height="37" rx="3" fill="#60a5fa"/>
          <ellipse id="flame4" cx="143.5" cy="87" rx="5.5" ry="8" fill="#fbbf24"/>
          <ellipse id="flameInner4" cx="143.5" cy="88" rx="2.5" ry="4.5" fill="#fef08a"/>
        </g>
 
        <!-- vela 5 -->
        <g id="candle5">
          <rect x="166" y="98" width="11" height="30" rx="3" fill="#f472b6"/>
          <ellipse id="flame5" cx="171.5" cy="94" rx="5.5" ry="8" fill="#fbbf24"/>
          <ellipse id="flameInner5" cx="171.5" cy="95" rx="2.5" ry="4.5" fill="#fef08a"/>
        </g>
 
        <!-- texto del pastel -->
        <text x="110" y="215" text-anchor="middle"
          font-family="'Cormorant Garamond', serif"
          font-size="13" fill="#9d174d" font-style="italic">
          Feliz cumpleaños linda
        </text>
        <text x="110" y="233" text-anchor="middle"
          font-family="'Cormorant Garamond', serif"
          font-size="11" fill="#be185d" opacity="0.75">
          toca para soplar las velitas
        </text>
      </svg>
 
      <p id="cakeMsg" style="
        font-family: 'Cormorant Garamond', serif;
        font-size: 17px;
        font-style: italic;
        color: #be185d;
        margin-top: 12px;
        min-height: 24px;
        transition: opacity 0.5s ease;
      "></p>
    </div>
    <!-- FIN PASTEL -->
 
    <p class="letter-sign">— Emilio ❤︎</p>
  </div>
</div>

    <p class="letter-sign">— Emilio ❤︎</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
